spring.application.name=queuebuddy
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/queuebuddy}
spring.datasource.username=${DB_USERNAME:queuebuddy_app}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}

management.endpoints.web.exposure.include=health

app.frontend-url=${FRONTEND_URL:http://localhost:3000}

app.cors.allowed-origins=${CORS_ORIGINS:${app.frontend-url}}

#app.mail.api-key=${RESEND_API_KEY:}
#app.mail.from-email=${MAIL_FROM_EMAIL:onboarding@resend.dev}
#app.mail.from-name=${MAIL_FROM_NAME:QueueBuddy}

app.mail.script-url=${MAIL_SCRIPT_URL:}
app.mail.secret=${MAIL_SECRET:}
app.mail.from-name=${MAIL_FROM_NAME:QueueBuddy}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiry-hours=8